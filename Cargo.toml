[package]
name = "memorust"
version = "0.1.0"
edition = "2024"
authors = ["Aleksandr Provotorov <provotorov@inbox.ru>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LigeronAhill/memorust"
description = "In-memory key-value store inspired by Redis, written in Rust with Tokio for asynchronous operations."

[lib]
path = "src/lib.rs"

[[bin]]
name = "memorust-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "memorust-server"
path = "src/bin/server.rs"

[dependencies]
# logs
tracing = "0.1"
tracing-subscriber = "0.3"
# cli
clap = { version = "4.5", features = ["derive"] }
# async
tokio = { version = "1.45", features = ["full"] }
# bytes
bytes = "1"
atoi = "2.0.0"
